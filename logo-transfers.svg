<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 165" role="img" aria-label="Transfers.ma">

  <!-- "Transfers" in brand orange -->
  <text
    x="2" y="132"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-style="italic"
    font-weight="900"
    font-size="120"
    fill="#F47920"
    textLength="352"
    lengthAdjust="spacingAndGlyphs">Transfers</text>

  <!-- ".ma" in brand navy -->
  <text
    x="355" y="132"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-style="italic"
    font-weight="900"
    font-size="120"
    fill="#1B3680"
    textLength="152"
    lengthAdjust="spacingAndGlyphs">.ma</text>

  <!-- Swoosh arc from lower-right curving up to airplane -->
  <path
    d="M 505,158 C 545,112 540,54 408,66"
    fill="none"
    stroke="#F47920"
    stroke-width="3.5"
    stroke-linecap="round"/>

  <!-- Airplane silhouette — drawn nose-right at origin, rotated -36deg, positioned upper-right -->
  <g transform="translate(388, 70) rotate(-36)">
    <!-- Fuselage -->
    <path fill="#F47920" d="M 88,0 C 80,-5 50,-6 15,-4 L 0,0 L 15,4 C 50,6 80,5 88,0 Z"/>
    <!-- Right wing (upper after rotation) -->
    <path fill="#F47920" d="M 40,-4 L 46,-28 L 59,-8 Z"/>
    <!-- Left wing (lower after rotation) -->
    <path fill="#F47920" d="M 40,4 L 46,28 L 59,8 Z"/>
    <!-- Right tail fin -->
    <path fill="#F47920" d="M 8,-2 L 7,-13 L 18,-4 Z"/>
    <!-- Left tail fin -->
    <path fill="#F47920" d="M 8,2 L 7,13 L 18,4 Z"/>
  </g>

</svg>
